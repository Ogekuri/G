[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.41.0", "build>=1.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "galias"
version = "0.45.0"
description = "Emulate personalized git aliases via an uvx-compatible interface."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Francesco Rolando" }
]
keywords = ["git", "alias", "uv", "astral", "uvx"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Configuration Management",
]

dependencies = ["pathspec"]

[dependency-groups]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Ogekuri/GAlias"
Repository = "https://github.com/Ogekuri/GAlias"
Changelog = "https://github.com/Ogekuri/GAlias/blob/master/CHANGELOG.md"
Issues = "https://github.com/Ogekuri/GAlias/issues"

[project.scripts]
galias = "git_alias.core:main"
g = "git_alias.core:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["git_alias", "git_alias.*"]

[tool.setuptools.package-data]
git_alias = ["*.py"]
